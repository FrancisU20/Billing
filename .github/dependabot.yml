version: 2
updates:

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  # Mantiene las actions actualizadas. Cuando los mantenedores publiquen
  # soporte para Node.js 24 (o cualquier otra mejora), Dependabot abre
  # un PR automáticamente para revisión.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Guayaquil
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions)"

  # ── CDK Python (infra) ─────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Guayaquil
    labels:
      - dependencies
      - infra
    commit-message:
      prefix: "chore(infra)"

  # ── Backend Python (lambdas) ───────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Guayaquil
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "chore(backend)"
