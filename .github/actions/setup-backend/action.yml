name: Setup Backend Python
description: >
  Instala Python 3.12, restaura el cache de pip y crea el venv del backend
  con todas las dependencias de runtime + CI (ruff, bandit, pip-audit, coverage).

inputs:
  python-version:
    description: Python version to use
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Setup Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-backend-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('backend/requirements.txt', 'backend/requirements-ci.txt') }}
        restore-keys: |
          pip-backend-${{ runner.os }}-py${{ inputs.python-version }}-
          pip-backend-${{ runner.os }}-

    - name: Install backend dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-ci.txt
