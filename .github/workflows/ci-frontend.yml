name: CI Frontend

on:
  push:
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    paths: ["frontend/**"]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: frontend/web

      - name: TypeScript check (web)
        run: npm run typecheck
        working-directory: frontend/web

      - name: Build (web)
        run: npm run build
        working-directory: frontend/web
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.execute-api.sa-east-1.amazonaws.com/dev/api/v1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: sa-east-1_placeholder
          NEXT_PUBLIC_COGNITO_CLIENT_ID: placeholder
          NEXT_PUBLIC_COGNITO_REGION: sa-east-1

      - name: Install shared dependencies
        run: npm ci
        working-directory: frontend/shared

      - name: TypeScript check (shared)
        run: npm run typecheck
        working-directory: frontend/shared
