name: CI Frontend

on:
  push:
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    paths: ["frontend/**"]
  workflow_call:  # permite ser invocado desde deploy-dev.yml

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            frontend/shared/package-lock.json

      # shared primero — web lo declara como file dependency
      - name: Install shared dependencies
        run: npm ci
        working-directory: frontend/shared

      - name: TypeScript check (shared)
        run: npm run typecheck
        working-directory: frontend/shared

      # web usa npm install (no npm ci) para que npm resuelva el file:../shared
      - name: Install web dependencies
        run: npm install
        working-directory: frontend/web

      # next build incluye type-check completo con resolución correcta de @/ aliases
      # tsc --noEmit standalone no resuelve los path aliases sin Next.js corriendo
      - name: Build + TypeScript check (web)
        run: npm run build
        working-directory: frontend/web
        env:
          NEXT_PUBLIC_API_URL: https://api-billing-dev.codelabsecuador.com/api/v1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: sa-east-1_placeholder
          NEXT_PUBLIC_COGNITO_CLIENT_ID: placeholder
          NEXT_PUBLIC_COGNITO_REGION: sa-east-1
