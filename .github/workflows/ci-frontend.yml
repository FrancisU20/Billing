name: CI Frontend

on:
  push:
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  pull_request:
    paths: ["frontend/**"]
  workflow_call:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            frontend/shared/package-lock.json

      - name: Install shared dependencies
        run: npm ci
        working-directory: frontend/shared

      - name: TypeScript check (shared)
        run: npm run typecheck
        working-directory: frontend/shared

      - name: Install web dependencies
        run: npm install
        working-directory: frontend/web

      # Vite: tsc + vite build en un solo comando — no necesita Next.js corriendo
      - name: Build (Vite + TypeScript check)
        run: npm run build
        working-directory: frontend/web
        env:
          VITE_API_URL: https://api-billing-dev.codelabsecuador.com/api/v1
          VITE_COGNITO_USER_POOL_ID: sa-east-1_placeholder
          VITE_COGNITO_CLIENT_ID: placeholder
          VITE_COGNITO_REGION: sa-east-1
