##############################################################################
# PR Checks — CodeLabs Billing Cloud
#
# Ejecuta en cada PR abierto o actualizado contra develop o master.
# Todos los jobs corren en paralelo para feedback rápido.
# El merge solo se permite si todos los checks pasan (branch protection).
#
# Jobs:
#   lint        → ruff check + ruff format
#   security    → bandit (SAST) + pip-audit (dependencias vulnerables)
#   unit-tests  → unittest + coverage report (mínimo 75%)
#   cdk-validate→ cdk ls (valida que el CDK Python compila correctamente)
##############################################################################

name: PR Checks

on:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened]

# Cancela runs anteriores del mismo PR para no desperdiciar minutos.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Mínimo de permisos — nunca write excepto donde sea explícitamente necesario.
permissions:
  contents: read
  pull-requests: write   # para publicar resumen de coverage como comentario

defaults:
  run:
    shell: bash

jobs:
  # ── Lint & Format ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend

      - name: Check code style (ruff format)
        working-directory: backend
        run: ruff format --check .

      - name: Lint (ruff check)
        working-directory: backend
        run: ruff check .

  # ── Security Scan ──────────────────────────────────────────────────────────
  security:
    name: Security Scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend

      - name: SAST — bandit
        working-directory: backend
        run: bandit -r lambdas/ shared/ -c pyproject.toml --severity-level medium

      - name: Dependency vulnerabilities — pip-audit
        working-directory: backend
        run: pip-audit -r requirements.txt --strict

  # ── Unit Tests + Coverage ──────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (coverage ≥ 75%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-backend

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/local
          AWS_DEFAULT_REGION: sa-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        working-directory: backend
        run: |
          coverage run \
            --source=lambdas,shared \
            -m unittest discover -s tests -p "test_*.py" -v
          coverage report
          coverage xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-pr-${{ github.event.pull_request.number }}
          path: backend/coverage.xml
          retention-days: 14

      - name: Coverage summary in PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const xml = fs.readFileSync('backend/coverage.xml', 'utf8');
            const match = xml.match(/line-rate="([^"]+)"/);
            if (!match) return;
            const pct = (parseFloat(match[1]) * 100).toFixed(1);
            const emoji = parseFloat(pct) >= 75 ? '✅' : '❌';
            const body = `## ${emoji} Coverage: ${pct}%\n\nVer artefacto \`coverage-report-pr-${{ github.event.pull_request.number }}\` para el reporte completo.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ── CDK Validate ───────────────────────────────────────────────────────────
  cdk-validate:
    name: CDK Validate (cdk ls)
    runs-on: ubuntu-latest
    env:
      CDK_DEFAULT_ACCOUNT: "890763499626"
      CDK_DEFAULT_REGION: "sa-east-1"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-cdk

      - name: Validate CDK stacks compile
        working-directory: infra
        run: cdk ls -c env=dev

      - name: CDK diff (informativo — no bloquea el PR)
        working-directory: infra
        continue-on-error: true
        run: |
          echo "## CDK Diff (sin credenciales — solo stacks sin lookups)" >> $GITHUB_STEP_SUMMARY
          cdk diff '*' -c env=dev 2>&1 | head -100 >> $GITHUB_STEP_SUMMARY || true
