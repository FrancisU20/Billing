name: Deploy Production

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Requiere aprobación manual en GitHub Environments

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - name: Install CDK Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
        working-directory: infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: sa-east-1

      - name: CDK diff
        run: cdk diff --context env=prod
        working-directory: infra

      - name: CDK deploy (prod)
        run: cdk deploy --all --context env=prod --require-approval never
        working-directory: infra
