name: Deploy Dev

on:
  push:
    branches: [develop]

permissions:
  id-token: write   # OIDC — sin credenciales IAM estáticas
  contents: read

jobs:
  ci-backend:
    uses: ./.github/workflows/ci-backend.yml

  ci-frontend:
    uses: ./.github/workflows/ci-frontend.yml

  deploy:
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      # Node.js es necesario para el CDK CLI (cdk es un comando npm)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - name: Install CDK Python dependencies
        run: pip install -r requirements.txt
        working-directory: infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: sa-east-1

      - name: CDK diff
        run: cdk diff --context env=dev
        working-directory: infra

      - name: CDK deploy (dev — auto-approve)
        run: cdk deploy --all --context env=dev --require-approval never
        working-directory: infra
