##############################################################################
# Deploy Dev — CodeLabs Billing Cloud
#
# Pipeline completo de CI/CD para el ambiente de desarrollo.
# Se ejecuta en cada push a la rama `develop`.
#
# Autenticación AWS: OIDC (sin credenciales estáticas en Secrets).
# Rol IAM: configurado en .github/oidc/cfn-oidc-role.yml
#
# Flujo de jobs (selectivo por cambios):
#
#   changes ─┬─→ backend CI ─→ cdk-synth ─┬─→ deploy-database ──────────────────────────┐
#            │                            ├─→ deploy-auth                               ├─→ deploy-api ─→ run-migrations ─→ smoke-tests ─┐
#            │                            ├─→ deploy-queues ──────────────────────────── ┘                                               ├─→ summary
#            │                            └─→ deploy-frontend-infra ────────────────────────────────────────────────────────────────────┐│
#            └─→ deploy-frontend (assets + invalidación CloudFront) ──────────────────────────────────────────────────────────────────── ┘┘
#
# Docs-only: changes + summary; no CI pesada ni deploy AWS.
#
# Nota sobre FRONTEND_BUCKET_NAME:
#   No se usa como Secret — el bucket name y el distribution ID se leen
#   directamente de los outputs de CloudFormation en deploy-frontend.
#   Esto evita secretos adicionales y mantiene la infra como fuente de verdad.
#
##############################################################################

name: Deploy — Dev

on:
  push:
    branches: [develop]

# Previene deploys solapados: el deploy en curso se completa antes del siguiente.
# No se cancela en curso — un deploy a medias es peor que uno en cola.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # requerido para OIDC
  actions: read

defaults:
  run:
    shell: bash

env:
  AWS_REGION:          sa-east-1
  CDK_DEFAULT_ACCOUNT: "890763499626"
  CDK_DEFAULT_REGION:  sa-east-1
  CDK_ENV:             dev

# ── CI Checks (defense in depth — también corren en PR) ───────────────────────
jobs:
  changes:
    name: 'Plan / Detect Changes'
    runs-on: ubuntu-latest
    outputs:
      backend_ci:  ${{ steps.flags.outputs.backend_ci }}
      cdk:         ${{ steps.flags.outputs.cdk }}
      database:    ${{ steps.flags.outputs.database }}
      auth:        ${{ steps.flags.outputs.auth }}
      queues:      ${{ steps.flags.outputs.queues }}
      api:         ${{ steps.flags.outputs.api }}
      migrations:  ${{ steps.flags.outputs.migrations }}
      frontend:    ${{ steps.flags.outputs.frontend }}
      deployable:  ${{ steps.flags.outputs.deployable }}
      docs_only:   ${{ steps.flags.outputs.docs_only }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: flags
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "${BEFORE}" ] || [[ "${BEFORE}" =~ ^0+$ ]]; then
            if git rev-parse "${AFTER}^" >/dev/null 2>&1; then
              BEFORE="${AFTER}^"
            else
              BEFORE="${AFTER}"
            fi
          fi

          git diff --name-only "${BEFORE}" "${AFTER}" | tee /tmp/changed-files.txt

          backend=false
          infra=false
          frontend=false
          workflow=false
          migrations=false
          docs=false
          other=false

          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              backend/migrations/*)
                backend=true
                migrations=true
                ;;
              backend/*|local/*)
                backend=true
                ;;
              infra/*)
                infra=true
                ;;
              frontend/*)
                frontend=true
                ;;
              .github/workflows/*|.github/actions/*)
                workflow=true
                ;;
              CLAUDE.md|README.md|docs/*|postman/*|*.md)
                docs=true
                ;;
              *)
                # Unknown root-level changes are treated conservatively as deployable.
                other=true
                ;;
            esac
          done < /tmp/changed-files.txt

          backend_ci=false
          cdk=false
          database=false
          auth=false
          queues=false
          api=false
          run_migrations=false
          deploy_frontend=false
          deployable=false
          docs_only=false

          if [ "${backend}" = true ] || [ "${workflow}" = true ] || [ "${other}" = true ]; then
            backend_ci=true
          fi
          if [ "${backend}" = true ] || [ "${infra}" = true ] || [ "${workflow}" = true ] || [ "${other}" = true ]; then
            cdk=true
            api=true
          fi
          if [ "${infra}" = true ] || [ "${workflow}" = true ] || [ "${other}" = true ]; then
            database=true
            auth=true
            queues=true
            run_migrations=true
          fi
          if [ "${migrations}" = true ] || [ "${workflow}" = true ] || [ "${other}" = true ]; then
            run_migrations=true
          fi
          if [ "${frontend}" = true ] || [ "${workflow}" = true ] || [ "${other}" = true ]; then
            deploy_frontend=true
          fi
          if [ "${backend}" = true ] || [ "${infra}" = true ] || [ "${frontend}" = true ] || [ "${workflow}" = true ] || [ "${other}" = true ]; then
            deployable=true
          fi
          if [ "${docs}" = true ] && [ "${deployable}" = false ]; then
            docs_only=true
          fi

          {
            echo "backend_ci=${backend_ci}"
            echo "cdk=${cdk}"
            echo "database=${database}"
            echo "auth=${auth}"
            echo "queues=${queues}"
            echo "api=${api}"
            echo "migrations=${run_migrations}"
            echo "frontend=${deploy_frontend}"
            echo "deployable=${deployable}"
            echo "docs_only=${docs_only}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Changed files"
            echo '```'
            cat /tmp/changed-files.txt
            echo '```'
            echo "deployable=${deployable}"
            echo "docs_only=${docs_only}"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: 'CI / Lint & Format'
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend_ci == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
      - name: ruff format
        working-directory: backend
        run: ruff format --check .
      - name: ruff check
        working-directory: backend
        run: ruff check .

  security:
    name: 'CI / Security Scan'
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend_ci == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend
      - name: bandit
        working-directory: backend
        run: bandit -r lambdas/ shared/ -c pyproject.toml --severity-level medium
      - name: pip-audit
        working-directory: backend
        run: pip-audit -r requirements.txt --strict

  unit-tests:
    name: 'CI / Unit Tests'
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend_ci == 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-backend

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/local
          AWS_DEFAULT_REGION: sa-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        working-directory: backend
        run: |
          coverage run \
            --source=lambdas,shared \
            -m unittest discover -s tests -p "test_*.py" -v
          coverage report
          coverage xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ github.sha }}
          path: backend/coverage.xml
          retention-days: 30

  # ── CDK Synth (bundling completo con OIDC) ────────────────────────────────
  cdk-synth:
    name: 'Build / CDK Synth'
    runs-on: ubuntu-latest
    needs: [changes, lint, security, unit-tests]
    if: |
      always() &&
      needs.changes.outputs.cdk == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    environment: dev

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-cdk-synth-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: CDK Synth (valida + bundlea todas las Lambdas)
        working-directory: infra
        run: cdk synth '*' -c env=${{ env.CDK_ENV }} --quiet

      - name: Upload CloudFormation templates
        uses: actions/upload-artifact@v7
        with:
          name: cfn-templates-${{ github.sha }}
          path: infra/cdk.out/*.template.json
          retention-days: 30

      - name: CDK Diff → Step Summary
        working-directory: infra
        run: |
          echo "## CDK Diff — ${{ env.CDK_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cdk diff '*' -c env=${{ env.CDK_ENV }} 2>&1 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Deploy Database ────────────────────────────────────────────────────────
  deploy-database:
    name: 'Infra / Database'
    runs-on: ubuntu-latest
    needs: [changes, cdk-synth]
    if: |
      always() &&
      needs.changes.outputs.database == 'true' &&
      needs.cdk-synth.result == 'success'
    environment: dev

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-deploy-database-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Deploy CodeLabsBilling-Dev-Database
        working-directory: infra
        run: |
          cdk deploy CodeLabsBilling-Dev-Database \
            -c env=${{ env.CDK_ENV }} \
            --require-approval never \
            --progress events \
            --outputs-file /tmp/database-outputs.json
          echo "### Database Stack Outputs" >> $GITHUB_STEP_SUMMARY
          cat /tmp/database-outputs.json >> $GITHUB_STEP_SUMMARY

  # ── Deploy Auth ────────────────────────────────────────────────────────────
  deploy-auth:
    name: 'Infra / Auth'
    runs-on: ubuntu-latest
    needs: [changes, cdk-synth]
    if: |
      always() &&
      needs.changes.outputs.auth == 'true' &&
      needs.cdk-synth.result == 'success'
    environment: dev

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-deploy-auth-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Deploy CodeLabsBilling-Dev-Auth
        working-directory: infra
        run: |
          cdk deploy CodeLabsBilling-Dev-Auth \
            -c env=${{ env.CDK_ENV }} \
            --require-approval never \
            --progress events

  # ── Deploy Queues ──────────────────────────────────────────────────────────
  deploy-queues:
    name: 'Infra / Queues'
    runs-on: ubuntu-latest
    needs: [changes, cdk-synth]
    if: |
      always() &&
      needs.changes.outputs.queues == 'true' &&
      needs.cdk-synth.result == 'success'
    environment: dev

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-deploy-queues-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Deploy CodeLabsBilling-Dev-Queues
        working-directory: infra
        run: |
          cdk deploy CodeLabsBilling-Dev-Queues \
            -c env=${{ env.CDK_ENV }} \
            --require-approval never \
            --progress events

  # ── Deploy API (espera los tres stacks base) ───────────────────────────────
  deploy-api:
    name: 'App / API'
    runs-on: ubuntu-latest
    needs: [changes, cdk-synth, deploy-database, deploy-auth, deploy-queues]
    if: |
      always() &&
      needs.changes.outputs.api == 'true' &&
      needs.cdk-synth.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    environment: dev

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-deploy-api-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Deploy CodeLabsBilling-Dev-Api
        working-directory: infra
        run: |
          cdk deploy CodeLabsBilling-Dev-Api \
            -c env=${{ env.CDK_ENV }} \
            --require-approval never \
            --progress events \
            --outputs-file /tmp/api-outputs.json

      - name: Extract API URL → output
        id: api-url
        run: |
          URL=$(jq -r '."CodeLabsBilling-Dev-Api".ApiCustomDomain //
                        ."CodeLabsBilling-Dev-Api".ApiUrl' /tmp/api-outputs.json)
          echo "url=${URL}" >> $GITHUB_OUTPUT
          echo "### API desplegada en: ${URL}" >> $GITHUB_STEP_SUMMARY

      - name: Upload API outputs artifact
        uses: actions/upload-artifact@v7
        with:
          name: api-outputs-${{ github.sha }}
          path: /tmp/api-outputs.json
          retention-days: 7

    outputs:
      api-url: ${{ steps.api-url.outputs.url }}

  # ── Run Migrations ─────────────────────────────────────────────────────────
  # Invoca el Lambda de migraciones desplegado en el stack Api.
  # Si el Lambda aún no existe (feature en desarrollo), el step se salta
  # limpiamente y el pipeline continúa.
  run-migrations:
    name: 'Verify / Migrations'
    runs-on: ubuntu-latest
    needs: [changes, deploy-api]
    if: |
      always() &&
      needs.changes.outputs.migrations == 'true' &&
      needs.deploy-api.result == 'success'
    environment: dev

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-migrations-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      - name: Check migrations Lambda
        id: check
        run: |
          LAMBDA_NAME="codelabs-billing-${{ env.CDK_ENV }}-migrations"
          if aws lambda get-function --function-name "${LAMBDA_NAME}" \
               --query 'Configuration.FunctionName' --output text > /dev/null 2>&1; then
            echo "exists=true"  >> $GITHUB_OUTPUT
            echo "name=${LAMBDA_NAME}" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "### Migrations — Skipped (Lambda no desplegado aún)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Invoke migrations Lambda
        if: steps.check.outputs.exists == 'true'
        run: |
          LAMBDA="${{ steps.check.outputs.name }}"
          echo "Invocando ${LAMBDA}..."

          aws lambda invoke \
            --function-name "${LAMBDA}" \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            --log-type Tail \
            --query 'LogResult' \
            --output text \
            /tmp/migrations-result.json \
            | base64 -d | tail -20

          FUNC_ERROR=$(jq -r '.FunctionError // empty' /tmp/migrations-result.json 2>/dev/null || echo "")

          echo "### Migrations" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/migrations-result.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [ -n "${FUNC_ERROR}" ]; then
            echo "Migrations Lambda retornó error: ${FUNC_ERROR}"
            exit 1
          fi
          echo "Migrations completadas" >> $GITHUB_STEP_SUMMARY

  # ── Deploy Frontend Infra (Certificate + CloudFront + S3) ─────────────────
  # Despliega CertificateStack (us-east-1) y FrontendStack (sa-east-1).
  # CertificateStack va primero — CDK lo resuelve via cross_region_references.
  # Solo corre cuando hay cambios en infra/ o workflow (igual que los otros stacks).
  deploy-frontend-infra:
    name: 'Infra / Frontend'
    runs-on: ubuntu-latest
    needs: [changes, cdk-synth]
    if: |
      always() &&
      needs.changes.outputs.cdk == 'true' &&
      needs.cdk-synth.result == 'success'
    environment: dev

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-cdk

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-deploy-frontend-infra-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      # CDK despliega Certificate (us-east-1) primero porque FrontendStack
      # depende de él via cross_region_references — el orden es automático.
      - name: Deploy Certificate + Frontend stacks
        working-directory: infra
        run: |
          cdk deploy CodeLabsBilling-Dev-Certificate CodeLabsBilling-Dev-Frontend \
            -c env=${{ env.CDK_ENV }} \
            --require-approval never \
            --progress events \
            --outputs-file /tmp/frontend-outputs.json

      - name: Frontend infra outputs → Step Summary
        run: |
          echo "### Frontend Infra Outputs" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/frontend-outputs.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Deploy Frontend Assets (Expo Web) ─────────────────────────────────────
  # Sube el build de Expo web a S3 con cache strategy diferenciada:
  #   - Assets con hash en nombre (_expo/**) → immutable, max-age=1y
  #   - index.html + *.json                 → no-cache, no-store
  # Al final crea una invalidación CloudFront /* para que los edge caches
  # sirvan de inmediato los nuevos entry points.
  #
  # El bucket y el distribution ID se leen de CloudFormation (no son Secrets).
  deploy-frontend:
    name: 'App / Frontend'
    runs-on: ubuntu-latest
    needs: [changes, deploy-frontend-infra]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.deploy-frontend-infra.result != 'failure'
    environment: dev

    steps:
      - uses: actions/checkout@v6

      - name: Check frontend exists
        id: check
        run: |
          if [ -f "frontend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "### Frontend — Skipped (frontend/package.json no encontrado)" >> $GITHUB_STEP_SUMMARY
          fi

      - uses: ./.github/actions/setup-frontend
        if: steps.check.outputs.exists == 'true'

      - name: Configure AWS credentials via OIDC
        if: steps.check.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-frontend-${{ github.run_id }}
          aws-region:        ${{ env.AWS_REGION }}

      # Lee bucket name y distribution ID de CloudFormation para no depender
      # de GitHub Secrets adicionales — la infra es la fuente de verdad.
      - name: Read CloudFormation outputs
        id: cfn
        if: steps.check.outputs.exists == 'true'
        run: |
          STACK="CodeLabsBilling-Dev-Frontend"

          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text 2>/dev/null || echo "")

          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -z "${BUCKET}" ]; then
            echo "### Frontend — Skipped (stack '${STACK}' no desplegado aún)" >> $GITHUB_STEP_SUMMARY
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "bucket=${BUCKET}"   >> $GITHUB_OUTPUT
            echo "dist_id=${DIST_ID}" >> $GITHUB_OUTPUT
            echo "exists=true"        >> $GITHUB_OUTPUT
          fi

      - name: Build Expo web
        if: steps.check.outputs.exists == 'true' && steps.cfn.outputs.exists == 'true'
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: npx expo export --platform web

      # Assets con hash en el nombre: inmutable a largo plazo.
      - name: Upload assets to S3 (immutable)
        if: steps.check.outputs.exists == 'true' && steps.cfn.outputs.exists == 'true'
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.cfn.outputs.bucket }}/" \
            --delete \
            --exclude "index.html" \
            --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"

      # index.html + manifests: sin cache para que el cliente siempre
      # reciba la versión más reciente del entry point.
      - name: Upload entry points to S3 (no-cache)
        if: steps.check.outputs.exists == 'true' && steps.cfn.outputs.exists == 'true'
        run: |
          aws s3 sync frontend/dist/ "s3://${{ steps.cfn.outputs.bucket }}/" \
            --include "index.html" \
            --include "*.json" \
            --cache-control "no-cache,no-store,must-revalidate"

      # Invalida todos los paths en CloudFront para que los edge caches
      # propaguen inmediatamente el nuevo index.html y manifests.
      - name: Invalidate CloudFront cache
        if: steps.check.outputs.exists == 'true' && steps.cfn.outputs.exists == 'true' && steps.cfn.outputs.dist_id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cfn.outputs.dist_id }}" \
            --paths "/*"

      - name: Summary
        if: steps.check.outputs.exists == 'true' && steps.cfn.outputs.exists == 'true'
        run: |
          echo "### Frontend desplegado (dev)" >> $GITHUB_STEP_SUMMARY
          echo "S3 bucket: \`${{ steps.cfn.outputs.bucket }}\`"   >> $GITHUB_STEP_SUMMARY
          echo "CloudFront: \`${{ steps.cfn.outputs.dist_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "URL: https://billing-dev.codelabsecuador.com"      >> $GITHUB_STEP_SUMMARY

  # ── Smoke Tests ────────────────────────────────────────────────────────────
  # Necesita deploy-api (para acceder a outputs.api-url) y run-migrations
  # (para garantizar que las migraciones ya corrieron).
  smoke-tests:
    name: 'Verify / Smoke Tests'
    runs-on: ubuntu-latest
    needs: [changes, deploy-api, run-migrations]
    if: |
      always() &&
      needs.changes.outputs.api == 'true' &&
      needs.deploy-api.result == 'success' &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')

    steps:
      - name: GET /plans — ruta pública (sin auth)
        run: |
          API_URL="${{ needs.deploy-api.outputs.api-url }}"

          echo "Probando ${API_URL}/plans ..."

          RESPONSE=$(curl -sf \
            --max-time 15 \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            -w "\nHTTP_STATUS:%{http_code}" \
            "${API_URL}/plans" 2>&1 || true)

          HTTP_STATUS=$(echo "${RESPONSE}" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "${RESPONSE}" | grep -v "HTTP_STATUS")

          echo "HTTP Status: ${HTTP_STATUS}"
          echo "Body (preview): $(echo "${BODY}" | head -c 200)"

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "Smoke test fallido — esperado 200, obtenido ${HTTP_STATUS}"
            exit 1
          fi

          python3 -c "
          import json, sys
          data = json.loads('''${BODY}''')
          assert data.get('success') == True, 'success != true'
          assert 'items' in data.get('data', {}), 'data.items missing'
          print('Contrato de respuesta correcto')
          "

          echo "### Smoke Tests — PASSED" >> $GITHUB_STEP_SUMMARY

  # ── Summary ────────────────────────────────────────────────────────────────
  summary:
    name: 'Summary'
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - security
      - unit-tests
      - cdk-synth
      - deploy-database
      - deploy-auth
      - deploy-queues
      - deploy-api
      - run-migrations
      - deploy-frontend-infra
      - deploy-frontend
      - smoke-tests
    if: always()

    steps:
      - name: Write deploy summary
        uses: actions/github-script@v9
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const jobs  = Object.entries(needs);
            const allPassed = jobs.every(([, j]) => ['success', 'skipped'].includes(j.result));
            const anyFailed = jobs.some(([, j])  => j.result === 'failure');
            const emoji = anyFailed ? '❌' : allPassed ? '✅' : '⚠️';
            const docsOnly = needs.changes.outputs.docs_only === 'true';

            let table = '| Job | Estado |\n|---|---|\n';
            for (const [name, job] of jobs) {
              const icon = { success: '✅', failure: '❌', skipped: '⏭️', cancelled: '🚫' }[job.result] ?? '❓';
              table += `| ${name} | ${icon} ${job.result} |\n`;
            }

            const summary = [
              `## ${emoji} Deploy Dev — ${docsOnly ? 'Docs only, deploy skipped' : anyFailed ? 'Con errores' : allPassed ? 'Exitoso' : 'Parcial'}`,
              '',
              `**Commit:** \`${{ github.sha }}\``,
              `**Branch:** \`${{ github.ref_name }}\``,
              `**Actor:** @${{ github.actor }}`,
              `**Deployable:** \`${needs.changes.outputs.deployable}\``,
              `**Docs only:** \`${needs.changes.outputs.docs_only}\``,
              '',
              table,
            ].join('\n');

            await core.summary.addRaw(summary).write();
