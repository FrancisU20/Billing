name: Deploy Dev

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  # ── Detección de cambios ────────────────────────────────────────────────
  # Determina qué capas del monorepo cambiaron para correr solo lo necesario.
  # dorny/paths-filter compara el commit actual contra el anterior del push.
  detect:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      infra:    ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # necesario para comparar con el commit anterior

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'infra/**'

  # ── CI ────────────────────────────────────────────────────────────────────
  ci-backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    uses: ./.github/workflows/ci-backend.yml

  ci-frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  # ── Deploy Infrastructure (CDK) ──────────────────────────────────────────
  # Corre si cambiaron backend (código Lambda) o infra (stacks CDK).
  deploy-infra:
    name: Deploy Infrastructure (CDK)
    needs: [detect, ci-backend, ci-frontend]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.detect.outputs.backend == 'true' || needs.detect.outputs.infra == 'true')
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - name: Install CDK Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
        working-directory: infra

      - name: Build Lambda Layers
        run: bash scripts/build-lambda-deps.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: sa-east-1

      - name: CDK deploy — infraestructura sa-east-1
        run: |
          cdk deploy \
            CodeLabsBilling-Dev-Network \
            CodeLabsBilling-Dev-Auth \
            CodeLabsBilling-Dev-Database \
            CodeLabsBilling-Dev-Storage \
            CodeLabsBilling-Dev-Queues \
            CodeLabsBilling-Dev-Security \
            CodeLabsBilling-Dev-Api \
            CodeLabsBilling-Dev-Observability \
            --context env=dev --require-approval never
        working-directory: infra

      - name: CDK deploy — CloudFront + certificado us-east-1
        run: |
          cdk deploy \
            CodeLabsBilling-Dev-Certificate \
            CodeLabsBilling-Dev-Frontend \
            --context env=dev --require-approval never
        working-directory: infra
        env:
          AWS_DEFAULT_REGION: us-east-1

  # ── Migraciones ───────────────────────────────────────────────────────────
  # Corre después de deploy-infra, solo si backend o infra cambiaron.
  migrate-db:
    name: Run Database Migrations
    needs: [detect, deploy-infra]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.detect.outputs.backend == 'true' || needs.detect.outputs.infra == 'true') &&
      needs.deploy-infra.result == 'success'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Run Alembic migrations via Lambda
        run: |
          aws lambda invoke \
            --function-name codelabs-billing-dev-migrate \
            --payload '{}' \
            --region sa-east-1 \
            --log-type Tail \
            /tmp/migrate-result.json
          echo "=== Migration result ==="
          cat /tmp/migrate-result.json
          if jq -e '.errorMessage' /tmp/migrate-result.json > /dev/null 2>&1; then
            echo "ERROR: Migration Lambda failed"
            exit 1
          fi

  # ── Deploy Frontend ───────────────────────────────────────────────────────
  # Corre si cambiaron frontend o infra (infra puede cambiar URLs/IDs de Cognito).
  # Lee los outputs de CloudFormation directamente — no depende de deploy-infra
  # para obtenerlos, funciona tanto si deploy-infra corrió como si fue saltado.
  deploy-frontend:
    name: Build and Deploy Frontend
    needs: [detect, deploy-infra, migrate-db]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.detect.outputs.frontend == 'true' || needs.detect.outputs.infra == 'true')
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/web/package-lock.json
            frontend/shared/package-lock.json

      - name: Install shared dependencies
        run: npm ci
        working-directory: frontend/shared

      - name: Install web dependencies
        run: npm install
        working-directory: frontend/web

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Read CloudFormation outputs
        id: cfn
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name CodeLabsBilling-Dev-Auth \
            --region sa-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text)
          WEB_CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name CodeLabsBilling-Dev-Auth \
            --region sa-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='WebClientId'].OutputValue" \
            --output text)
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name CodeLabsBilling-Dev-Api \
            --region sa-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='ApiCustomDomainUrl'].OutputValue" \
            --output text)
          WEB_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name CodeLabsBilling-Dev-Frontend \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='WebBucketName'].OutputValue" \
            --output text)
          CF_DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name CodeLabsBilling-Dev-Frontend \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          echo "user_pool_id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "web_client_id=$WEB_CLIENT_ID" >> $GITHUB_OUTPUT
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "web_bucket=$WEB_BUCKET" >> $GITHUB_OUTPUT
          echo "cf_dist_id=$CF_DIST_ID" >> $GITHUB_OUTPUT

      - name: Build (Vite)
        run: npm run build
        working-directory: frontend/web
        env:
          VITE_API_URL: ${{ steps.cfn.outputs.api_url }}/api/v1
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cfn.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cfn.outputs.web_client_id }}
          VITE_COGNITO_REGION: sa-east-1

      - name: Configure AWS credentials us-east-1 (CloudFront)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy a S3
        run: |
          aws s3 sync frontend/web/dist/ \
            s3://${{ steps.cfn.outputs.web_bucket }} \
            --delete \
            --region us-east-1

      - name: Invalidar cache de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cfn.outputs.cf_dist_id }} \
            --paths "/*"
