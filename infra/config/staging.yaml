# Configuración ambiente staging — validación pre-producción
env: staging
region: sa-east-1
account: ""  # se resuelve via CDK_DEFAULT_ACCOUNT en CI

aurora:
  min_capacity: 0.5
  max_capacity: 8
  database_name: codelabs_billing

network:
  nat_type: gateway
  availability_zones: 1  # 1 AZ en staging para reducir costo

waf:
  enabled: true

rds_proxy:
  enabled: true

lambda:
  memory_mb: 256
  timeout_seconds: 30
  powertools_log_level: INFO

cloudwatch:
  log_retention_days: 14
  custom_dashboards: false

s3:
  lifecycle_transition_ia_days: 90
  lifecycle_transition_glacier_days: 365
  lifecycle_expiration_days: 2555

sqs:
  invoice_processing_visibility_timeout: 300
  sri_retry_visibility_timeout: 120
  email_dispatch_visibility_timeout: 60
  batch_import_visibility_timeout: 600
  max_receive_count: 5

cognito:
  mfa_enforcement: "OPTIONAL"

domain:
  enabled: true
  hosted_zone: codelabsecuador.com
  frontend: billing-staging.codelabsecuador.com
  api: api-billing-staging.codelabsecuador.com
