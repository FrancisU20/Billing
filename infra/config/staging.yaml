env:     staging
region:  sa-east-1
account: ""   # resuelto via CDK_DEFAULT_ACCOUNT

# Recibe avisos internos de leads Enterprise capturados por /onboarding
superadmin_email: ventas@codelabsecuador.com

dynamodb:
  billing_mode:            PAY_PER_REQUEST
  point_in_time_recovery:  true   # habilitado en staging (igual que prod)
  removal_policy:          RETAIN  # nunca destruir tablas en staging

cognito:
  mfa: "OFF"

api:
  throttling:
    default:
      burst_limit: 30
      rate_limit: 15
    onboarding_otp_request:
      burst_limit: 5
      rate_limit: 1
    onboarding_otp_confirm:
      burst_limit: 10
      rate_limit: 2

domain:
  hosted_zone: codelabsecuador.com
  api:         api-billing-staging.codelabsecuador.com
  frontend:    billing-staging.codelabsecuador.com
  enabled:     true   # CloudFront habilitado en staging y prod

cors:
  origins:
    - https://billing-staging.codelabsecuador.com
  headers:
    - authorization
    - content-type
    - x-idempotency-key
