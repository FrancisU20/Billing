env:     dev
region:  sa-east-1
account: ""   # resuelto via CDK_DEFAULT_ACCOUNT

# Recibe avisos internos de leads Enterprise capturados por /onboarding
superadmin_email: ventas@codelabsecuador.com

dynamodb:
  billing_mode: PAY_PER_REQUEST
  point_in_time_recovery: false
  removal_policy: DESTROY

cognito:
  mfa: "OFF"

domain:
  hosted_zone: codelabsecuador.com
  api:         api-billing-dev.codelabsecuador.com
  frontend:    billing-dev.codelabsecuador.com

cors:
  origins:
    - https://billing-dev.codelabsecuador.com
    - http://localhost:8081
    - http://localhost:8082
    - http://localhost:8083
  headers:
    - authorization
    - content-type
    - x-idempotency-key
