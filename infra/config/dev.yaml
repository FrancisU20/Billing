env:     dev
region:  sa-east-1
account: ""   # resuelto via CDK_DEFAULT_ACCOUNT

# Recibe avisos internos: leads Corporativo (/onboarding) y alertas de pagos huerfanos
superadmin_email: admin@codelabsecuador.com

dynamodb:
  billing_mode: PAY_PER_REQUEST
  point_in_time_recovery: false
  removal_policy: DESTROY

cognito:
  mfa: "OFF"

api:
  throttling:
    default:
      burst_limit: 20
      rate_limit: 10
    onboarding_otp_request:
      burst_limit: 5
      rate_limit: 1
    onboarding_otp_confirm:
      burst_limit: 10
      rate_limit: 2
    auth_forgot_password:
      burst_limit: 5
      rate_limit: 1

domain:
  hosted_zone: codelabsecuador.com
  api:         api-wali-dev.codelabsecuador.com
  frontend:    wali-dev.codelabsecuador.com

cors:
  origins:
    - https://wali-dev.codelabsecuador.com
    - http://localhost:8081
    - http://localhost:8082
    - http://localhost:8083
  headers:
    - authorization
    - content-type
    - x-idempotency-key
