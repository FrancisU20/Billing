# Configuración ambiente dev — Bootstrapping (~$50/mes + CloudFront ~$1/mes)
env: dev
region: sa-east-1
account: ""  # se resuelve via CDK_DEFAULT_ACCOUNT en CI

# Aurora PostgreSQL Serverless v2
aurora:
  min_capacity: 0
  max_capacity: 4
  database_name: codelabs_billing

# NAT: instancia EC2 t4g.nano (~$4/mes vs $35/mes NAT Gateway)
network:
  nat_type: instance
  nat_instance_type: t4g.nano
  availability_zones: 2
  nat_count: 1

waf:
  enabled: false

rds_proxy:
  enabled: false

lambda:
  memory_mb: 256
  timeout_seconds: 30
  powertools_log_level: DEBUG

cloudwatch:
  log_retention_days: 7
  custom_dashboards: false

s3:
  lifecycle_transition_ia_days: 90
  lifecycle_transition_glacier_days: 365
  lifecycle_expiration_days: 2555

sqs:
  invoice_processing_visibility_timeout: 300
  sri_retry_visibility_timeout: 120
  email_dispatch_visibility_timeout: 60
  batch_import_visibility_timeout: 600
  max_receive_count: 5

cognito:
  mfa_enforcement: "OFF"

# Dominio — habilitado para dev con CloudFront + API Gateway custom domain
domain:
  enabled: true
  hosted_zone: codelabsecuador.com
  hosted_zone_id: Z04488832YM9VCPO41EJM
  frontend: billing-dev.codelabsecuador.com
  api: api-billing-dev.codelabsecuador.com
