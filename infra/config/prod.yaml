env:     prod
region:  sa-east-1
account: ""   # resuelto via CDK_DEFAULT_ACCOUNT

# Recibe avisos internos: leads Corporativo (/onboarding) y alertas de pagos huerfanos
superadmin_email: admin@codelabsecuador.com

dynamodb:
  billing_mode:            PAY_PER_REQUEST
  point_in_time_recovery:  true
  removal_policy:          RETAIN

cognito:
  mfa: "OFF"

api:
  throttling:
    default:
      burst_limit: 50
      rate_limit: 25
    onboarding_otp_request:
      burst_limit: 5
      rate_limit: 1
    onboarding_otp_confirm:
      burst_limit: 10
      rate_limit: 2

domain:
  hosted_zone: codelabsecuador.com
  api:         api-wali.codelabsecuador.com
  frontend:    wali.codelabsecuador.com
  enabled:     true

cors:
  origins:
    - https://wali.codelabsecuador.com
  headers:
    - authorization
    - content-type
    - x-idempotency-key
