env:     prod
region:  sa-east-1
account: ""   # resuelto via CDK_DEFAULT_ACCOUNT

# Recibe avisos internos de leads Enterprise capturados por /onboarding
superadmin_email: ventas@codelabsecuador.com

dynamodb:
  billing_mode:            PAY_PER_REQUEST
  point_in_time_recovery:  true
  removal_policy:          RETAIN

cognito:
  mfa: "OFF"

api:
  throttling:
    default:
      burst_limit: 50
      rate_limit: 25
    onboarding_otp_request:
      burst_limit: 5
      rate_limit: 1
    onboarding_otp_confirm:
      burst_limit: 10
      rate_limit: 2

domain:
  hosted_zone: codelabsecuador.com
  api:         api-billing.codelabsecuador.com
  frontend:    billing.codelabsecuador.com
  enabled:     true

cors:
  origins:
    - https://billing.codelabsecuador.com
  headers:
    - authorization
    - content-type
    - x-idempotency-key
